<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carga de Cargos – Legajos</title>
  <style>
    :root {
      --azul: #003087;
      --azul-claro: #1565c0;
      --gris: #64748b;
      --fondo: #f4f8ff;
      --blanco: #ffffff;
      --borde: #d7e2f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Sora', sans-serif;
      background: var(--fondo);
      color: #172a4e;
      min-height: 100vh;
      padding: 20px;
    }
    .page {
      max-width: 1040px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
    }
    .title {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .title h1 { margin: 0; font-size: 28px; color: var(--azul); }
    .title p { margin: 0; color: var(--gris); }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      background: var(--azul);
      color: white;
    }
    .button.secondary { background: #64748b; }
    .card {
      background: var(--blanco);
      border: 1px solid var(--borde);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(0, 48, 135, 0.08);
    }
    .info-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }
    .info-box {
      background: #eef3ff;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid #dce4f4;
    }
    .info-box strong { display: block; margin-bottom: 8px; color: var(--azul); }
    
    .cargo-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 24px;
    }
    .cargo-item {
      background: #fcfdfe;
      border: 1.5px solid var(--borde);
      border-radius: 16px;
      padding: 20px;
      position: relative;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .cargo-item:hover {
      border-color: var(--azul-claro);
      box-shadow: 0 8px 24px rgba(0, 48, 135, 0.04);
    }
    .cargo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .cargo-header h3 {
      margin: 0;
      font-size: 16px;
      color: var(--azul);
      font-weight: 700;
    }
    .btn-delete-cargo {
      background: #fee2e2;
      color: #ef4444;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-delete-cargo:hover {
      background: #fecaca;
    }
    .cargo-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }
    .cargo-grid .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .cargo-grid .campo label {
      font-size: 12px;
      font-weight: 600;
      color: var(--gris);
    }
    .cargo-grid .campo input,
    .cargo-grid .campo select,
    .cargo-grid .campo textarea {
      width: 100%;
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      background: #fafcff;
      color: #1f3053;
      outline: none;
    }
    .cargo-grid .campo input:focus,
    .cargo-grid .campo select:focus,
    .cargo-grid .campo textarea:focus {
      border-color: var(--azul-claro);
      background: #fff;
    }
    .cargo-grid .campo-small-group {
      display: flex;
      gap: 8px;
    }
    .cargo-grid .campo-small {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .cargo-grid .campo-small label {
      font-size: 12px;
      font-weight: 600;
      color: var(--gris);
    }
    .cargo-grid .campo-small select {
      width: 100%;
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      background: #fafcff;
      color: #1f3053;
      outline: none;
    }
    .cargo-grid .full-width {
      grid-column: span 12;
    }
    textarea { resize: vertical; min-height: 50px; }
    
    @media (max-width: 768px) {
      .cargo-grid {
        grid-template-columns: 1fr;
      }
      .cargo-grid .campo {
        grid-column: span 1 !important;
      }
      .cargo-grid .full-width {
        grid-column: span 1 !important;
      }
    }
    .footer {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }
    .notice {
      color: #475569;
      font-size: 13px;
      max-width: 600px;
    }
    .success {
      display: none;
      margin-top: 22px;
      background: #def7ec;
      border: 1px solid #a7f3d0;
      color: #064e3b;
      padding: 18px 20px;
      border-radius: 16px;
    }
    .success.show { display: block; }
    .error {
      margin-top: 14px;
      background: #fde8e8;
      border: 1px solid #f8b4b4;
      color: #9b1c1c;
      padding: 18px 20px;
      border-radius: 16px;
      display: none;
    }
    .error:not(:empty) { display: block; }

    /* Toast Notification System */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .toast {
      background: var(--blanco);
      color: #172a4e;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 48, 135, 0.15);
      border: 1px solid var(--borde);
      padding: 16px 20px;
      min-width: 320px;
      max-width: 420px;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateX(120%);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    }
    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }
    .toast-success {
      border-left: 5px solid #10b981;
      background: #f0fdf4;
    }
    .toast-error {
      border-left: 5px solid #ef4444;
      background: #fef2f2;
    }
    .toast-icon {
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toast-success .toast-icon {
      color: #10b981;
    }
    .toast-error .toast-icon {
      color: #ef4444;
    }
    .toast-message {
      font-size: 14px;
      font-weight: 600;
      flex-grow: 1;
    }
    .toast-close {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #94a3b8;
      padding: 0;
      display: flex;
      align-items: center;
    }
    .toast-close:hover {
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="title">
        <h1>Carga de Cargos</h1>
        <p>Completá las líneas de cupo, materia, revista y la toma de posesión.</p>
      </div>
      <div class="actions">
        <button class="button secondary" id="btnBack">Volver</button>
        <button class="button" id="addRow">Agregar cargo</button>
        <button class="button secondary" id="logoutBtn">Cerrar sesión</button>
      </div>
    </header>

    <div class="card">
      <div class="info-row">
        <div class="info-box">
          <strong>DNI autorizado</strong>
          <span id="dniValue">Cargando...</span>
        </div>
        <div class="info-box">
          <strong>Docente</strong>
          <span id="docenteValue">Cargando...</span>
        </div>
      </div>

      <div class="cargo-list" id="cargoList"></div>

      <div class="footer">
        <p class="notice">Completá al menos un cargo antes de guardar. Los cargos se guardarán en el legajo asociado al DNI autorizado.</p>
        <button class="button" id="saveBtn">Guardar cargos</button>
      </div>
      <div class="error" id="errorMsg"></div>
      <div class="success" id="successMsg">Los cargos se guardaron correctamente.</div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const allowedOptions = ['A', 'D', 'T'];
    const cargoList = document.getElementById('cargoList');
    const addRowButton = document.getElementById('addRow');
    const saveBtn = document.getElementById('saveBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const dniValue = document.getElementById('dniValue');
    const docenteValue = document.getElementById('docenteValue');
    const btnBack = document.getElementById('btnBack');
    const logoutBtn = document.getElementById('logoutBtn');
    const searchParams = new URLSearchParams(window.location.search);
    const selectedLegajoId = searchParams.get('legajoId');
    let currentTargetId = null;

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      
      const icon = type === 'success' ? '✓' : '✗';
      
      toast.innerHTML = `
        <span class="toast-icon">${icon}</span>
        <span class="toast-message">${message}</span>
        <button class="toast-close" type="button">&times;</button>
      `;

      container.appendChild(toast);
      toast.offsetHeight; // trigger reflow
      toast.classList.add('show');

      const closeBtn = toast.querySelector('.toast-close');
      const closeHandler = () => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      };
      
      closeBtn.addEventListener('click', closeHandler);
      setTimeout(closeHandler, 4000);
    }

    function showSuccess(message) {
      successMsg.textContent = message;
      successMsg.classList.add('show');
      errorMsg.textContent = '';
      showToast(message, 'success');
    }

    function showError(message) {
      errorMsg.textContent = message;
      successMsg.classList.remove('show');
      showToast(message, 'error');
    }

    function updateCargoIndices() {
      const items = cargoList.querySelectorAll('.cargo-item');
      items.forEach((item, idx) => {
        const indexSpan = item.querySelector('.cargo-index');
        if (indexSpan) indexSpan.textContent = idx + 1;
      });
    }

    function createCargoItem(data = {}) {
      const item = document.createElement('div');
      item.className = 'cargo-item';
      item.innerHTML = `
        <div class="cargo-header">
          <h3>Cargo #<span class="cargo-index"></span></h3>
          <button type="button" class="btn-delete-cargo">Eliminar cargo</button>
        </div>
        <div class="cargo-grid">
          <div class="campo" style="grid-column: span 3;">
            <label>Cupof</label>
            <input type="text" name="cupof" value="${data.cupof || ''}" placeholder="450244" />
          </div>
          <div class="campo" style="grid-column: span 4;">
            <label>Materia</label>
            <input type="text" name="materia" value="${data.materia || ''}" placeholder="EMATP (CII)" />
          </div>
          <div class="campo" style="grid-column: span 2;">
            <label>Revista</label>
            <input type="text" name="revista" value="${data.revista || ''}" placeholder="Prov." />
          </div>
          <div class="campo" style="grid-column: span 3;">
            <label>Carga</label>
            <input type="text" name="carga" value="${data.carga || ''}" placeholder="Alternado" />
          </div>

          <div class="campo" style="grid-column: span 4;">
            <label>Revista (A / D / T)</label>
            <div class="campo-small-group">
              <div class="campo-small">
                <select name="a">
                  <option value="">-</option>
                  <option value="A" ${data.a === 'A' ? 'selected' : ''}>A</option>
                </select>
              </div>
              <div class="campo-small">
                <select name="d">
                  <option value="">-</option>
                  <option value="D" ${data.d === 'D' ? 'selected' : ''}>D</option>
                </select>
              </div>
              <div class="campo-small">
                <select name="t">
                  <option value="">-</option>
                  <option value="T" ${data.t === 'T' ? 'selected' : ''}>T</option>
                </select>
              </div>
            </div>
          </div>
          <div class="campo" style="grid-column: span 4;">
            <label>Toma posesión</label>
            <input type="date" name="tomaPosesion" value="${data.tomaPosesion || ''}" />
          </div>
          <div class="campo" style="grid-column: span 4;">
            <label>Cese</label>
            <input type="date" name="cese" value="${data.cese || ''}" />
          </div>

          <div class="campo full-width">
            <label>Observaciones</label>
            <textarea name="observaciones" placeholder="Observaciones...">${data.observaciones || ''}</textarea>
          </div>
        </div>
      `;

      item.querySelector('.btn-delete-cargo').addEventListener('click', () => {
        if (confirm('¿Estás seguro de que deseas eliminar este cargo?')) {
          item.remove();
          updateCargoIndices();
          showSuccess('Cargo eliminado correctamente.');
        }
      });

      cargoList.appendChild(item);
      updateCargoIndices();
    }

    function collectRows() {
      const items = Array.from(cargoList.querySelectorAll('.cargo-item'));
      return items.map(item => {
        const formData = {};
        item.querySelectorAll('input, select, textarea').forEach(input => {
          formData[input.name] = input.value;
        });
        return formData;
      });
    }

    async function loadProfile() {
      try {
        const target = selectedLegajoId ? `/api/legajos/${encodeURIComponent(selectedLegajoId)}` : '/api/legajos/mi-legajo';
        const response = await fetch(target);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'No autorizado');
        currentTargetId = selectedLegajoId || null;
        dniValue.textContent = result.data.dni;
        docenteValue.textContent = result.data.apellidoNombre || 'Sin nombre registrado';
        if (selectedLegajoId) {
          const note = document.createElement('div');
          note.style.marginTop = '12px';
          note.style.color = '#0f4fc3';
          note.textContent = 'Estás viendo el formulario para el docente seleccionado desde el panel.';
          document.querySelector('.info-row').appendChild(note);
        }
        btnBack.style.display = 'inline-block';
        if (result.data.cargos?.length) {
          result.data.cargos.forEach(cargo => createCargoItem({
            cupof: cargo.cupof,
            materia: cargo.materia,
            revista: cargo.revista,
            carga: cargo.carga,
            a: cargo.a,
            d: cargo.d,
            t: cargo.t,
            tomaPosesion: cargo.tomaPosesion ? cargo.tomaPosesion.slice(0, 10) : '',
            cese: cargo.cese ? cargo.cese.slice(0, 10) : '',
            observaciones: cargo.observaciones
          }));
        } else {
          createCargoItem();
        }
      } catch (err) {
        errorMsg.textContent = err.message;
      }
    }

    addRowButton.addEventListener('click', () => createCargoItem());

    btnBack.addEventListener('click', () => {
      window.location.href = selectedLegajoId ? '/admin' : '/form';
    });

    saveBtn.addEventListener('click', async () => {
      showError('');
      successMsg.classList.remove('show');

      const cargos = collectRows().filter(row => row.cupof || row.materia || row.revista || row.carga || row.tomaPosesion || row.cese || row.observaciones);
      if (!cargos.length) {
        showError('Agregá al menos un cargo con datos para guardar.');
        return;
      }

      try {
        const body = { cargos };
        if (currentTargetId) body.legajoId = currentTargetId;
        const response = await fetch('/api/legajos/cargos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Error al guardar cargos');
        showSuccess('Los cargos se guardaron correctamente.');
      } catch (err) {
        showError(err.message);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await fetch('/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    loadProfile();
  </script>
</body>
</html>
